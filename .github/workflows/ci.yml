name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  qt-client:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt-version: '6.8.3'
          - os: macos-latest
            qt-version: '6.11.1'
          - os: windows-latest
            qt-version: '6.8.3'
    runs-on: ${{ matrix.os }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Qt 설치
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          cache: true

      - name: Ninja 설치
        if: runner.os != 'Windows'
        run: python -m pip install ninja

      - name: Qt 클라이언트 구성 (Linux, macOS)
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build/qt-client -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRSS_BUILD_NETWORK_TARGETS=OFF
          -DRSS_BUILD_POSTGRES=OFF
          -DRSS_BUILD_QT_CLIENT=ON

      - name: Qt 클라이언트 구성 (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -S . -B build/qt-client -A x64
          -DRSS_BUILD_NETWORK_TARGETS=OFF
          -DRSS_BUILD_POSTGRES=OFF
          -DRSS_BUILD_QT_CLIENT=ON

      - name: Qt 클라이언트 빌드 (Linux, macOS)
        if: runner.os != 'Windows'
        run: cmake --build build/qt-client --parallel

      - name: Qt 클라이언트 빌드 (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build/qt-client --config Release --parallel

      - name: Qt 클라이언트 테스트 (Linux, macOS)
        if: runner.os != 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          ctest --test-dir build/qt-client
          --output-on-failure --timeout 30

      - name: Qt 클라이언트 테스트 (Windows)
        if: runner.os == 'Windows'
        env:
          QT_QPA_PLATFORM: offscreen
        run: >-
          ctest --test-dir build/qt-client -C Release
          --output-on-failure --timeout 30

  core-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            configure: >-
              cmake -S . -B build/core
              -DCMAKE_BUILD_TYPE=Release
              -DRSS_BUILD_NETWORK_TARGETS=OFF
              -DRSS_BUILD_POSTGRES=OFF
              -DRSS_BUILD_BENCHMARKS=ON
            build: cmake --build build/core --parallel
            test: ctest --test-dir build/core --output-on-failure --timeout 30
            benchmark: ./build/core/rss_microbenchmarks --benchmark_dry_run
          - os: windows-latest
            configure: >-
              cmake -S . -B build/core
              -DRSS_BUILD_NETWORK_TARGETS=OFF
              -DRSS_BUILD_POSTGRES=OFF
              -DRSS_BUILD_BENCHMARKS=ON
            build: cmake --build build/core --config Release --parallel
            test: ctest --test-dir build/core -C Release --output-on-failure --timeout 30
            benchmark: .\build\core\Release\rss_microbenchmarks.exe --benchmark_dry_run
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure core targets
        run: ${{ matrix.configure }}

      - name: Build core targets
        run: ${{ matrix.build }}

      - name: Test core targets
        run: ${{ matrix.test }}

      - name: Check core microbenchmarks
        run: ${{ matrix.benchmark }}

  build-and-test:
    runs-on: ubuntu-24.04
    env:
      RSS_TEST_DATABASE_URL: postgresql://rss:rss_test@127.0.0.1:5432/rss_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rss
          POSTGRES_PASSWORD: rss_test
          POSTGRES_DB: rss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rss -d rss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake libpq-dev ninja-build postgresql-client

      - name: Configure
        run: >
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRSS_BUILD_NETWORK_TARGETS=ON
          -DRSS_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build/release --parallel

      - name: Apply PostgreSQL migrations
        run: >-
          psql "$RSS_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f libs/server-persistence-postgres/migrations/001_users.sql

      - name: Test
        run: ctest --test-dir build/release --output-on-failure --timeout 30

      - name: Check microbenchmarks
        run: ./build/release/rss_microbenchmarks --benchmark_dry_run

  sanitizers:
    runs-on: ubuntu-24.04
    env:
      RSS_TEST_DATABASE_URL: postgresql://rss:rss_test@127.0.0.1:5432/rss_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rss
          POSTGRES_PASSWORD: rss_test
          POSTGRES_DB: rss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rss -d rss_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: 빌드 도구 설치
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          cmake libpq-dev ninja-build postgresql-client

      - name: Sanitizer 구성
        run: >
          cmake -S . -B build/sanitizers -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRSS_BUILD_NETWORK_TARGETS=ON
          -DRSS_BUILD_BENCHMARKS=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: 빌드
        run: cmake --build build/sanitizers --parallel

      - name: PostgreSQL migration 적용
        run: >-
          psql "$RSS_TEST_DATABASE_URL" -v ON_ERROR_STOP=1
          -f libs/server-persistence-postgres/migrations/001_users.sql

      - name: 테스트
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/sanitizers --output-on-failure --timeout 60

  compose-smoke-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Start PostgreSQL
        run: docker compose up -d postgres

      - name: Apply migrations
        run: docker compose run --rm migrate

      - name: Reapply migrations
        run: docker compose run --rm migrate

      - name: Verify migrated schema
        run: |
          docker compose exec -T postgres psql \
            --username=rss \
            --dbname=rss \
            --set=ON_ERROR_STOP=1 <<'SQL'
          DO $verify$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM schema_migrations WHERE version = 1
            ) THEN
              RAISE EXCEPTION 'migration version 1 is missing';
            END IF;
            IF to_regclass('public.users') IS NULL THEN
              RAISE EXCEPTION 'users table is missing';
            END IF;
          END
          $verify$;
          SQL

      - name: Clean up Compose resources
        if: always()
        run: docker compose down -v

  code-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Clang tools
        run: >
          sudo apt-get update &&
          sudo apt-get install --yes clang-format-18 clang-tidy-18 cmake
          libpq-dev ninja-build

      - name: Configure
        run: >
          cmake -S . -B build/quality -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRSS_BUILD_NETWORK_TARGETS=ON
          -DRSS_BUILD_BENCHMARKS=ON

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Check formatting
        run: cmake --build build/quality --target format-check

      - name: Run Google clang-tidy checks
        run: cmake --build build/quality --target tidy-check
