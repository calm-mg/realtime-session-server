name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            configure: >-
              cmake -S . -B build/core
              -DCMAKE_BUILD_TYPE=Release
              -DRSS_BUILD_NETWORK_TARGETS=OFF
              -DRSS_BUILD_BENCHMARKS=ON
            build: cmake --build build/core --parallel
            test: ctest --test-dir build/core --output-on-failure
            benchmark: ./build/core/rss_microbenchmarks --benchmark_dry_run
          - os: windows-latest
            configure: >-
              cmake -S . -B build/core
              -DRSS_BUILD_NETWORK_TARGETS=OFF
              -DRSS_BUILD_BENCHMARKS=ON
            build: cmake --build build/core --config Release --parallel
            test: ctest --test-dir build/core -C Release --output-on-failure
            benchmark: .\build\core\Release\rss_microbenchmarks.exe --benchmark_dry_run
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure core targets
        run: ${{ matrix.configure }}

      - name: Build core targets
        run: ${{ matrix.build }}

      - name: Test core targets
        run: ${{ matrix.test }}

      - name: Check core microbenchmarks
        run: ${{ matrix.benchmark }}

  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes cmake ninja-build

      - name: Configure
        run: >
          cmake -S . -B build/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DRSS_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build/release --parallel

      - name: Test
        run: ctest --test-dir build/release --output-on-failure

      - name: Check microbenchmarks
        run: ./build/release/rss_microbenchmarks --benchmark_dry_run

  code-quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Clang tools
        run: >
          sudo apt-get update &&
          sudo apt-get install --yes clang-format-18 clang-tidy-18 cmake
          ninja-build

      - name: Configure
        run: >
          cmake -S . -B build/quality -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DRSS_BUILD_BENCHMARKS=ON

      - name: Check formatting
        run: cmake --build build/quality --target format-check

      - name: Run Google clang-tidy checks
        run: cmake --build build/quality --target tidy-check
